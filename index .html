<style>
  :root {
    --paper: #F3F5F2;
    --ink: #1A2421;
    --muted: #5B6863;
    --accent: #2F6B4F;
    --rule: #C7D3D6;
    --surface: #FFFFFF;
    --serif: "Young Serif", Georgia, "Times New Roman", serif;
    --sans: "Libre Franklin", "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #141A18;
      --ink: #E4EAE6;
      --muted: #9AA8A2;
      --accent: #7FC1A0;
      --rule: #34444A;
      --surface: #1B2320;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 1.0625rem;
    line-height: 1.6;
  }
  a { color: var(--accent); text-underline-offset: 3px; }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 2px; }
  .wrap { max-width: 880px; margin: 0 auto; padding: 0 1.5rem; }

  header.top { border-bottom: 1px solid var(--rule); }
  header.top .wrap { display: flex; justify-content: space-between; align-items: center; padding-top: 1rem; padding-bottom: 1rem; gap: 1rem; flex-wrap: wrap; }
  .mark { font-family: var(--serif); font-size: 1.1rem; text-decoration: none; color: var(--ink); }
  nav ul { list-style: none; display: flex; gap: 1.25rem; flex-wrap: wrap; }
  nav a { color: var(--muted); text-decoration: none; font-size: 0.95rem; }
  nav a:hover { color: var(--ink); }

  .hero { padding: 4rem 0 3rem; }
  .hero h1 { font-family: var(--serif); font-weight: 400; font-size: clamp(2.5rem, 6.5vw, 4rem); line-height: 1.05; }
  .hero-grid { display: grid; grid-template-columns: 1fr 220px; gap: 2.5rem; align-items: center; }
  .headshot { width: 100%; height: auto; aspect-ratio: 4 / 5; object-fit: cover; border: 1px solid var(--rule); display: block; }
  .hero .sub { margin-top: 0.75rem; font-size: 1.2rem; color: var(--muted); max-width: 52ch; }
  .actions { list-style: none; margin-top: 1.75rem; display: flex; gap: 0.75rem; flex-wrap: wrap; }
  .actions a {
    display: inline-block; padding: 0.65rem 1.1rem;
    border: 1px solid var(--ink); color: var(--ink);
    text-decoration: none; font-weight: 500;
  }
  .actions a:hover { background: var(--ink); color: var(--paper); }
  .actions a.primary { background: var(--accent); border-color: var(--accent); color: var(--paper); }

  .facts {
    margin-top: 2.75rem;
    display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
    background: var(--surface); border: 1px solid var(--rule);
  }
  .facts div { padding: 1rem 1.25rem; border-right: 1px solid var(--rule); }
  .facts div:last-child { border-right: 0; }
  .facts dt { color: var(--muted); font-size: 0.875rem; }
  .facts dd { font-weight: 500; margin-top: 0.15rem; }

  section { padding: 3.25rem 0; border-top: 1px solid var(--rule); }
  section h2 { font-family: var(--serif); font-weight: 400; font-size: 1.8rem; margin-bottom: 1.5rem; }
  .prose p { max-width: 64ch; }
  .prose p + p { margin-top: 1rem; }

  .entries { display: grid; gap: 2rem; }
  .entry { display: grid; grid-template-columns: 10.5rem 1fr; gap: 1.5rem; }
  .entry .when { color: var(--muted); font-size: 0.95rem; padding-top: 0.15rem; }
  .entry h3 { font-size: 1.1rem; font-weight: 600; }
  .entry .org { color: var(--accent); font-weight: 500; }
  .entry ul { margin-top: 0.5rem; padding-left: 1.1rem; max-width: 62ch; }
  .entry li + li { margin-top: 0.3rem; }
  .entry li::marker { color: var(--muted); }

  .projects { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1.5rem; }
  .project { border-top: 3px solid var(--accent); padding-top: 0.9rem; }
  .project h3 { font-size: 1.1rem; font-weight: 600; margin-bottom: 0.35rem; }
  .project p { color: var(--muted); }
  .project .tools { margin-top: 0.6rem; font-size: 0.9rem; color: var(--ink); }

  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 2.5rem; }
  .list { list-style: none; }
  .list li { padding: 0.55rem 0; border-bottom: 1px solid var(--rule); }
  .list span { display: block; color: var(--muted); font-size: 0.9rem; }

  footer { border-top: 1px solid var(--rule); padding: 2rem 0 3rem; color: var(--muted); font-size: 0.9rem; }

  @media (max-width: 640px) {
    .hero { padding: 2.75rem 0 2.25rem; }
    .hero-grid { grid-template-columns: 1fr; gap: 1.5rem; }
    .headshot { max-width: 170px; order: -1; }
    .entry { grid-template-columns: 1fr; gap: 0.2rem; }
    .two-col { grid-template-columns: 1fr; gap: 2rem; }
    .facts div { border-right: 0; border-bottom: 1px solid var(--rule); }
    .facts div:last-child { border-bottom: 0; }
  }
</style>
